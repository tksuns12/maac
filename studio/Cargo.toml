[workspace]

[package]
name = "maac-studio"
version = "0.1.0"
edition = "2021"
description = "Companion native Rust studio GUI for MaaC (Music as a Code)"
license = "Apache-2.0"

[features]
default = ["jit"]
jit = ["maac/jit"]

[dependencies]
cpal = "0.15"
hound = "3.5"
iced = { version = "0.13", features = ["canvas", "tokio"] }
libc = "0.2"
libloading = "0.8"
maac = { path = ".." }
notify = "7"
num-traits = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vst3-host = { version = "0.11", default-features = false }

# Audio rendering runs 10-20x slower at opt-level 0; keep dev builds playable.
[profile.dev]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
