# Weekly dependency updates. Minor and patch updates arrive as one grouped
# pull request per ecosystem; major updates arrive one per dependency. CI runs
# on each pull request, including the tests that pin rendered output.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # The workflows pin each action to a commit; Dependabot updates the pin and
  # its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # The pinned checkers for the Python checks in CI.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      python-checkers:
        patterns:
          - "*"
