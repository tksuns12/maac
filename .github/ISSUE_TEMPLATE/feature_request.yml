name: Feature or idea
description: Propose an instrument, a language feature, an analysis, or a change to a command.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        MaaC keeps a small musical core and puts everything it can in libraries, engine extensions and tools; the [design principles](https://github.com/tksuns12/maac/blob/main/docs/design/design-principles.md) explain the boundaries. Larger changes usually start as a proposal in `docs/`, so an issue that explains the need is the right first step.
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The music, sound or workflow you want, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could look, in source, on the command line or in the output.
  - type: dropdown
    id: area
    attributes:
      label: Where it belongs, if you have a view
      options:
        - Not sure
        - The language or score
        - Instruments and sound
        - Mixing and delivery
        - Analysis
        - Commands and tooling
        - Documentation
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
