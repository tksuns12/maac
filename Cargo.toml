[package]
name = "maac"
version = "0.1.0"
edition = "2021"
description = "MaaC (Music as a Code) parser, compiler, and renderer"
license = "Apache-2.0"
default-run = "maac"

[lib]
name = "maac"
path = "src/lib.rs"

[[bin]]
name = "maac"
path = "src/main.rs"

[dependencies]
cap-std = "4.0.3"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3.27"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true

[target."cfg(unix)".dependencies]
libc = "0.2"
