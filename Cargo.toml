[package]
name = "maac"
version = "0.2.0"
edition = "2021"
description = "MaaC (Music as a Code) parser, compiler, and renderer"
license = "Apache-2.0"
repository = "https://github.com/tksuns12/maac"
readme = "README.md"
keywords = ["music", "audio", "dsl", "synthesizer", "composition"]
categories = ["multimedia::audio", "command-line-utilities"]
default-run = "maac"

[lib]
name = "maac"
path = "src/lib.rs"

[[bin]]
name = "maac"
path = "src/main.rs"

[dependencies]
cap-std = "4.0.3"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3.27"

[dev-dependencies]

# The tests render audio, which runs 10-20 times slower unoptimized: the suite
# took about 980 s of test time at opt-level 0 and 89 s at 2. Debug assertions
# and overflow checks stay on, and rendered output is unchanged.
[profile.dev]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true

[target."cfg(unix)".dependencies]
libc = "0.2"
