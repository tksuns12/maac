[package]
name = "maac"
version = "0.6.2"
edition = "2021"
description = "MaaC (Music as a Code) parser, compiler, and renderer"
license = "Apache-2.0"
repository = "https://github.com/tksuns12/maac"
readme = "README.md"
keywords = ["music", "audio", "dsl", "synthesizer", "composition"]
categories = ["multimedia::audio", "command-line-utilities"]
default-run = "maac"
# The song renders in docs/assets/audio are 15 MB of the 19 MB package, and
# crates.io rejects uploads over 10 MB. They stay in the repository and the
# README links to them there.
exclude = ["docs/assets/audio/"]

[lib]
name = "maac"
path = "src/lib.rs"

[[bin]]
name = "maac"
path = "src/main.rs"

[features]
default = []
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]

[dependencies]
cap-std = "4.0.3"
clap = { version = "4.5", features = ["derive"] }
cranelift-codegen = { version = "0.137.2", optional = true }
cranelift-frontend = { version = "0.137.2", optional = true }
cranelift-jit = { version = "0.137.2", optional = true }
cranelift-module = { version = "0.137.2", optional = true }
cranelift-native = { version = "0.137.2", optional = true }
hound = "3.5"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3.27"

[dev-dependencies]

# The tests render audio, which runs 10-20 times slower unoptimized: the suite
# took about 980 s of test time at opt-level 0 and 89 s at 2. Debug assertions
# and overflow checks stay on, and rendered output is unchanged.
[profile.dev]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true

[target."cfg(unix)".dependencies]
libc = "0.2"
